name: cicd-pipeline

on: # what triggers the workflow
  push:
    branches: [main]


jobs:
  ci:
    runs-on: ubuntu-latest # short-lived virtual machine
    permissions:
      contents: read # read access to repository contents
    steps: # steps execute sequentially
      - name: Copy source code from repo into virtual machine
        uses: actions/checkout@v4

      - name: Install the Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Store build output for the next job
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  cd:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write # write access to GitHub Pages
      id-token: write # write access to OpenID Connect tokens
    environment:
      name: github-pages
    steps:
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4